# =====================================================================
# CI/CD del frontend (React + Vite) con GitHub Actions
#
#   PR / push a feature/*, develop  -> CI: lint (eslint) + typecheck/build + build de la imagen
#   push a main o tag v*            -> CD: además publica la imagen en GHCR
#                                       ghcr.io/<owner>/umb-planifica-web:{sha, latest, vX.Y.Z}
#
# Estrategia GitFlow: feature/* -> develop -> release/* -> main (+ tag vX.Y.Z)
# =====================================================================
name: Frontend CI/CD

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: umb-planifica-web

jobs:
  build:
    name: Lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4     # usa la versión de "packageManager" en package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Typecheck + build (tsc -b && vite build)
        run: pnpm build

      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Imagen Docker
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Metadatos (etiquetas de la imagen)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Login en GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (y publicar en main / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VITE_API_BASE_URL=
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
