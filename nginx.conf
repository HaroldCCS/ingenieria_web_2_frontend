# =====================================================================
# Plantilla de Nginx para UMB Planifica (Ejercicio 3).
# La imagen nginx-unprivileged la procesa con envsubst al arrancar:
#   /etc/nginx/templates/default.conf.template -> /etc/nginx/conf.d/default.conf
# Solo se sustituyen variables de entorno definidas (API_UPSTREAM);
# las variables propias de Nginx ($host, $uri...) quedan intactas.
#   - Docker Compose: API_UPSTREAM=http://api:8000 (nombre del servicio en la red interna)
#   - Cloud Run u otro entorno: API_UPSTREAM=https://url-de-la-api
# =====================================================================
server {
    listen 8080;                 # usuario no root: no puede usar puertos < 1024
    server_name _;
    server_tokens off;           # no revelar la versión de Nginx

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;    # subida del historial académico en PDF

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad. Ojo: Nginx NO hereda add_header en un location que
    # declare los suyos, por eso se repiten en /assets/ y en /.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck del propio contenedor web
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reenvío a la API por la red interna: el navegador solo habla con Nginx,
    # así no hace falta CORS y la API no se publica al exterior.
    # Sin barra final en proxy_pass: se conserva el prefijo /api/v1/... que usa FastAPI.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        # Host del upstream (necesario si la API está en Cloud Run/HTTPS); el original va en X-Forwarded-Host
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos con hash en el nombre: caché larga e inmutable
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: cualquier otra ruta la resuelve React Router
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
